name: CI / CD — Aurevia

on:
  push:
    branches: [main, dev_deploy]
  pull_request:
    branches: [main, dev_deploy]
  workflow_dispatch:

jobs:
  # ── CI: runs on every push and pull request ────────────────────────────
  ci:
    name: CI — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Write frontend env file
        env:
          FRONTEND_ENV_FILE: ${{ secrets.FRONTEND_ENV_FILE }}
        run: |
          if [ -n "$FRONTEND_ENV_FILE" ]; then
            printf '%s\n' "$FRONTEND_ENV_FILE" > frontend/.env
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
        continue-on-error: true # not blocking deploy until existing lint errors are cleaned up

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Backend has no code yet; these steps activate once backend/package.json exists.
      - name: Check for backend package
        id: backend
        run: |
          if [ -f backend/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi

      - name: Install backend dependencies
        if: steps.backend.outputs.exists == 'true'
        working-directory: backend
        run: npm ci

  # ── CD: only on push to main / dev_deploy, after CI passes ─────────────
  deploy:
    name: CD — Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev_deploy')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release archive
        run: git archive --format=tar.gz --output=release.tar.gz HEAD

      - name: Write env files
        env:
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
          FRONTEND_ENV_FILE: ${{ secrets.FRONTEND_ENV_FILE }}
        run: |
          printf '%s\n' "$BACKEND_ENV_FILE" > backend.env
          printf '%s\n' "$FRONTEND_ENV_FILE" > frontend.env

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release to VPS
        run: |
          SSH_TARGET="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          scp -P "${{ secrets.VPS_PORT }}" release.tar.gz backend.env frontend.env "$SSH_TARGET:/tmp/"

      - name: Deploy on VPS with Docker Compose
        env:
          DEPLOY_PATH: ${{ secrets.VPS_APP_DIR || '/root/aurevia' }}
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" << 'EOF'
            set -e
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            tar -xzf /tmp/release.tar.gz
            mkdir -p backend frontend
            mv /tmp/backend.env backend/.env
            mv /tmp/frontend.env frontend/.env
            rm -f /tmp/release.tar.gz

            docker compose build
            docker compose up -d --force-recreate
            docker image prune -f

            echo "Deployment complete."
            docker compose ps
          EOF
